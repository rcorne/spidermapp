[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toomer"
version = "1.0.0"
description = "Caja de herramientas de escritorio para análisis de ecommerce, marketing y SEO (basada en EcommerceTools)"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "PySide6>=6.6", "pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "openpyxl>=3.1", "httpx>=0.27",
    "beautifulsoup4>=4.12", "lxml>=5.0", "google-api-python-client>=2.100", "google-auth>=2.20",
]

[project.scripts]
toomer = "toomer.main:main"

[tool.setuptools.packages.find]
include = ["toomer*"]

[tool.setuptools.package-data]
toomer = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
