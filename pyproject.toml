[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spidermapp"
version = "0.1.0"
description = "Auditor de SEO de escritorio, similar a Screaming Frog"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "h2>=4.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PySide6>=6.6",
    "playwright>=1.44",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "tldextract>=5.0",
    "fpdf2>=2.7",
    "python-pptx>=1.0",
    "cryptography>=42.0",
    "websockets>=12.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "pydantic[email]>=2.6",
]

[project.scripts]
spidermapp = "spidermapp.main:main"

[tool.setuptools.packages.find]
include = ["spidermapp*", "pidge_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
