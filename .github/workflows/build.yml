name: Build Pidge

# PyInstaller can only build for the OS it runs on — a Mac cannot produce a
# Windows .exe. That's why the Windows binary is built here, on a real
# windows-latest runner, rather than locally.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt system libraries
        # PySide6 links against these at import time even under the offscreen
        # platform, and the bare Ubuntu runner doesn't ship them — without
        # this the GUI test modules fail to import with "libEGL.so.1: cannot
        # open shared object file".
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        # The GUI tests need a Qt platform plugin; offscreen is the headless one.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build .app
        run: pyinstaller packaging/spidermapp.spec --noconfirm
      - name: Package .dmg
        run: |
          rm -rf packaging/dmg_staging packaging/Pidge.dmg
          mkdir -p packaging/dmg_staging
          cp -R dist/Pidge.app packaging/dmg_staging/
          ln -s /Applications packaging/dmg_staging/Applications
          cp packaging/icon/Spidermapp.icns packaging/dmg_staging/.VolumeIcon.icns
          hdiutil create -srcfolder packaging/dmg_staging -volname "Pidge" \
            -fs HFS+ -format UDZO -ov packaging/Pidge.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Pidge-macos
          path: packaging/Pidge.dmg

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build .exe
        run: pyinstaller packaging/spidermapp.spec --noconfirm
      - name: Smoke-test the built binary
        # Catches the classic packaging failure — a missing hidden import
        # that only shows up in the frozen app — without needing a display.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Start-Process -FilePath "dist\Pidge\Pidge.exe" -PassThru | Out-Null
          Start-Sleep -Seconds 20
          $proc = Get-Process Pidge -ErrorAction SilentlyContinue
          if (-not $proc) { throw "Pidge.exe exited instead of staying open" }
          Stop-Process -Name Pidge -Force
        shell: pwsh
      - name: Build the installer
        # ISCC is Inno Setup's command-line compiler. It ships on the
        # windows-latest image, but install it if that ever changes rather
        # than failing the build on a missing tool.
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc packaging\windows\pidge.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
        shell: pwsh
      - name: Verify the installer was produced
        run: |
          $setup = Get-ChildItem dist\installer\Pidge-Setup-*.exe -ErrorAction SilentlyContinue
          if (-not $setup) { throw "no installer was produced" }
          "Installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"
        shell: pwsh
      - name: Zip the raw build
        # Kept alongside the installer for anyone who'd rather run the app
        # portable, without installing it.
        run: Compress-Archive -Path dist\Pidge\* -DestinationPath Pidge-windows-portable.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Pidge-windows-installer
          path: dist/installer/Pidge-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Pidge-windows-portable
          path: Pidge-windows-portable.zip

  release:
    # Only on a version tag: attaches both installers to the GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Pidge-macos/Pidge.dmg
            artifacts/Pidge-windows-installer/Pidge-Setup-*.exe
            artifacts/Pidge-windows-portable/Pidge-windows-portable.zip
