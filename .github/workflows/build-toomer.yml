name: Build Toomer

# Igual que Pidge: PyInstaller solo compila para el SO donde corre, así que el
# .exe se construye en windows-latest y el .app/.dmg en macos-latest.
on:
  push:
    branches: [main]
    tags: ["toomer-v*"]
    paths: ["toomer/**", ".github/workflows/build-toomer.yml"]
  pull_request:
    branches: [main]
    paths: ["toomer/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: toomer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build .app
        run: pyinstaller packaging/toomer.spec --noconfirm
      - name: Package .dmg
        run: |
          rm -rf packaging/dmg_staging packaging/Toomer.dmg
          mkdir -p packaging/dmg_staging
          cp -R dist/Toomer.app packaging/dmg_staging/
          ln -s /Applications packaging/dmg_staging/Applications
          hdiutil create -srcfolder packaging/dmg_staging -volname "Toomer" -fs HFS+ -format UDZO -ov packaging/Toomer.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Toomer-macos
          path: toomer/packaging/Toomer.dmg

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build .exe
        run: pyinstaller packaging/toomer.spec --noconfirm
      - name: Smoke-test the built binary
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Start-Process -FilePath "dist\Toomer\Toomer.exe" -PassThru | Out-Null
          Start-Sleep -Seconds 20
          $proc = Get-Process Toomer -ErrorAction SilentlyContinue
          if (-not $proc) { throw "Toomer.exe exited instead of staying open" }
          Stop-Process -Name Toomer -Force
        shell: pwsh
      - name: Build the installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc packaging\windows\toomer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
        shell: pwsh
      - name: Zip the raw build
        run: Compress-Archive -Path dist\Toomer\* -DestinationPath Toomer-windows-portable.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Toomer-windows-installer
          path: toomer/dist/installer/Toomer-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Toomer-windows-portable
          path: toomer/Toomer-windows-portable.zip

  release:
    if: startsWith(github.ref, 'refs/tags/toomer-v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Toomer-macos/Toomer.dmg
            artifacts/Toomer-windows-installer/Toomer-Setup-*.exe
            artifacts/Toomer-windows-portable/Toomer-windows-portable.zip
